<style>

body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;color:#fff;padding:20px}

/* ===== Main Menu ===== */

.app-card h3{font-size:18px;margin-bottom:6px;color:#f5af19}
.app-card p{font-size:13px;color:#aaa;line-height:1.6}
.app-card .badge{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(245,175,25,.15);color:#f5af19}

.app-panel.active{display:block}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#38ef7d;color:#000;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}

// ===== GLOBAL =====
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hsmEncrypt(text,key){let r='';for(let i=0;i<text.length;i++)r+=String.fromCharCode(text.charCodeAt(i)^key.charCodeAt(i%key.length));return btoa(unescape(encodeURIComponent(r)))}
function hsmDecrypt(enc,key){try{const t=decodeURIComponent(escape(atob(enc)));let r='';for(let i=0;i<t.length;i++)r+=String.fromCharCode(t.charCodeAt(i)^key.charCodeAt(i%key.length));return r}catch(e){return''}}

/* ===== تطبيع رقم الهاتف: أرقام عربية→إنكليزية، وإصلاح صيغة العراق 07… → 9647… ===== */
function obNormPhone(raw){
  let d=String(raw==null?'':raw)
    .replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-0x0660)})
    .replace(/[\u06F0-\u06F9]/g,function(c){return String(c.charCodeAt(0)-0x06F0)})
    .replace(/[^0-9+]/g,'').replace(/\+/g,'');
  if(d.indexOf('00')===0)d=d.slice(2);
  if(d.indexOf('964')===0)return d;
  if(d.indexOf('07')===0&&d.length===11)return '964'+d.slice(1);   /* 0770… → 964770… */
  if(d.indexOf('7')===0&&d.length===10)return '964'+d;             /* 770… → 964770… */
  return d;
}
/* تحويل المبلغ: أرقام عربية وفواصل → رقم */
function obNormAmount(v){
  var d=String(v==null?'':v)
    .replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-0x0660)})
    .replace(/[\u06F0-\u06F9]/g,function(c){return String(c.charCodeAt(0)-0x06F0)})
    .replace(/[^\d.]/g,'');
  var n=parseFloat(d);return isNaN(n)?null:n;
}


/* ===================================================================
   ✦ مولّد مفاتيح «الجدول المدرسي»
   منقول حرفياً من التطبيق (نفس السر، نفس دوال التجزئة) حتى يكون
   المفتاح المولّد هنا مقبولاً في التطبيق فوراً بلا أي تعديل عليه.
   =================================================================== */
const OB_SECRET = (function () {
  const p = [[77,65,83,79,85,68,73], [83,67,72,69,68,85,76,69]];
  const j = String.fromCharCode(45);
  return String.fromCharCode.apply(null, p[0]) + j +
         String.fromCharCode.apply(null, p[1]) + j +
         [50,48,50,54].map(c => String.fromCharCode(c)).join('') + j +
         String.fromCharCode(72, 78);
})();
const OB_ALPHA = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function obHash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
  }
  return h >>> 0;
}
function obHashWide(str, rounds) {
  let out = '', seed = str;
  for (let r = 0; r < (rounds || 4); r++) {
    seed = str + '|' + r + '|' + obHash32(seed + r);
    out += ('00000000' + obHash32(seed).toString(16)).slice(-8);
  }
  return out.toUpperCase();
}
/* تطبيع: أرقام عربية/فارسية تُحوَّل (لا تُحذف) ومحارف الاتجاه تُنظَّف */
function obNormKeyStr(str) {
  return String(str == null ? '' : str)
    .replace(/[\u0660-\u0669]/g, function (d) { return String(d.charCodeAt(0) - 0x0660); })
    .replace(/[\u06F0-\u06F9]/g, function (d) { return String(d.charCodeAt(0) - 0x06F0); })
    .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '')
    .toUpperCase()
    .replace(/[^0-9A-Z]/g, '');
}
/* مفتاح 16 حرفاً XXXX-XXXX-XXXX-XXXX لرمز جهاز 12 حرفاً */
function obKeyFor(devCode) {
  const clean = obNormKeyStr(devCode);
  const h = obHashWide(OB_SECRET + '#' + clean + '#' + OB_SECRET, 5);
  let out = '';
  for (let i = 0; i < 16; i++) {
    out += OB_ALPHA[parseInt(h.substr(i * 2, 2), 16) % OB_ALPHA.length];
  }
  return out.replace(/(.{4})/g, '$1-').replace(/-$/, '');
}


/* ===================================================================
   ✦ مولّد مفاتيح «الجدول الأسبوعي للمدارس المهنية» (VTS)
   خوارزمية ووسم ومخزن مستقلون تماماً عن الجدول المدرسي (OB) وبقية
   التطبيقات. لا يصدر إلا VTS-XXXX-XXXX-XXXX-XXXX لرمز جهاز VTS خاص.
   =================================================================== */
const VTS_LICENSE_APP_ID='vts-professional-timetable';
const VTS_LICENSE_SECRET='VTS-PROFESSIONAL-TIMETABLE-HN-2026-9B7';
const VTS_CODE_PREFIX='VTS';
const VTS_ALPHA='23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function vtsAscii(value){
  return String(value==null?'':value)
    .replace(/[٠-٩]/g,function(d){return String(d.charCodeAt(0)-0x0660)})
    .replace(/[۰-۹]/g,function(d){return String(d.charCodeAt(0)-0x06F0)})
    .replace(/[‎‏‪-‮⁦-⁩﻿]/g,'');
}
function vtsNormalizeDeviceCode(value){
  const shown=vtsAscii(value).trim().toUpperCase();
  const compact=shown.replace(/[^A-Z0-9]/g,'');
  return /^VTS(?:[\s_-]|$)/.test(shown)?compact.slice(VTS_CODE_PREFIX.length):compact;
}
function vtsDeviceIsValid(clean){
  return clean.length===12 && clean.split('').every(function(char){return VTS_ALPHA.indexOf(char)>=0});
}
function vtsFormatDeviceCode(value){
  const clean=vtsNormalizeDeviceCode(value);
  return VTS_CODE_PREFIX+'-'+clean.slice(0,4)+'-'+clean.slice(4,8)+'-'+clean.slice(8,12);
}
function vtsHash32(text){
  let hash=0x811c9dc5;
  for(let i=0;i<text.length;i++){
    hash^=text.charCodeAt(i);
    hash=Math.imul(hash,0x01000193)>>>0;
    hash^=hash>>>13;
  }
  return hash>>>0;
}
function vtsHashWide(text,rounds){
  let result='',seed=String(text);
  for(let round=0;round<(rounds||7);round++){
    seed=VTS_LICENSE_SECRET+'|'+round+'|'+seed+'|'+vtsHash32(seed+'|'+round);
    result+=('00000000'+vtsHash32(seed).toString(16)).slice(-8);
  }
  return result.toUpperCase();
}
function vtsActivationKeyFor(deviceCode){
  const clean=vtsNormalizeDeviceCode(deviceCode);
  if(!vtsDeviceIsValid(clean))return '';
  const digest=vtsHashWide(VTS_LICENSE_APP_ID+'|'+clean+'|'+VTS_LICENSE_SECRET,7);
  let payload='';
  for(let index=0;index<16;index++)payload+=VTS_ALPHA[parseInt(digest.substr(index*2,2),16)%VTS_ALPHA.length];
  return VTS_CODE_PREFIX+'-'+payload.replace(/(.{4})/g,'$1-').replace(/-$/,'');
}


/* ===================================================================
   ✦ مولّد مفاتيح «نظام المخاطبات الرسمية» (MKH)
   منقول حرفياً من كود التطبيق (نفس السر ونفس دوال التجزئة) حتى يكون
   المفتاح المولّد هنا مقبولاً في التطبيق فوراً بلا أي تعديل عليه.
   رمز الجهاز: 6 أحرف (بلا 0/1/I/O) — المفتاح: MKH-XXXX-XXXX دائم
   =================================================================== */
const MKH_SECRET = 'MKH#2026~Act';
const MKH_ALPHA  = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function mkhHash(str) {
  let h1 = 0x811c9dc5, h2 = 0x9e3779b1;
  const t = (MKH_SECRET + '|' + str).toUpperCase();
  for (let i = 0; i < t.length; i++) {
    h1 ^= t.charCodeAt(i);            h1 = Math.imul(h1, 0x01000193) >>> 0;
    h2 ^= t.charCodeAt(t.length - 1 - i); h2 = Math.imul(h2, 0x01000193) >>> 0;
  }
  let out = '', a = h1 >>> 0, b = h2 >>> 0;
  for (let i = 0; i < 10; i++) {
    const v = (a + ((b * 7) >>> 0) + i * 31) % MKH_ALPHA.length;
    out += MKH_ALPHA[v];
    a = ((a >>> 3) ^ (b << 2)) >>> 0;
    b = (b + v * 13 + t.length) >>> 0;
  }
  return out;
}
function mkhKeyFor(devCodeClean) {
  const h = mkhHash(devCodeClean);
  return 'MKH-' + h.slice(0, 4) + '-' + h.slice(4, 8);
}
/* تطبيع رمز الجهاز: أرقام عربية/فارسية تُحوَّل، ويُقبل الشكل XXX-XXX */

  return String(raw == null ? '' : raw)

}

/* ===================================================================
   ✦ مولّد مفاتيح «نظام نتائج المدرسة»
   منقول حرفياً من كود التطبيق (نفس السر ونفس دوال التجزئة) حتى يكون
   المفتاح المولّد هنا مقبولاً في التطبيق فوراً بلا أي تعديل عليه.
   الفرق عن البقيّة: المفتاح يحمل حرف خطة (M شهري / Y سنوي / L دائم)
   وتاريخ انتهاء مُشفَّراً بداخله، فتُبنى صلاحية شهر/سنة كتاريخ ثابت.
   =================================================================== */
const SR_SECRET = 'NIBRAS-RESULTS-HN-2026';
const SR_ALPHA  = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const SR_REF_EPOCH = Date.UTC(2025,0,1);
const SR_DAY_MS = 24*60*60*1000;
function srHash32(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return h>>>0;
}
function srHashWide(str, rounds){
  let out='', seed=str;
  for(let r=0;r<(rounds||4);r++){
    seed = str+'|'+r+'|'+srHash32(seed+r);
    out += ('00000000'+srHash32(seed).toString(16)).slice(-8);
  }
  return out.toUpperCase();
}
function srNormKeyStr(str){
  return String(str==null?'':str)
    .replace(/[\u0660-\u0669]/g,function(d){return String(d.charCodeAt(0)-0x0660);})
    .replace(/[\u06F0-\u06F9]/g,function(d){return String(d.charCodeAt(0)-0x06F0);})
    .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'')
    .toUpperCase().replace(/[^0-9A-Z]/g,'');
}
function srEncDays(n){
  n = Math.max(0, Math.min(31*31*31-1, Math.round(n)));
  let s='';
  for(let i=0;i<3;i++){ s = SR_ALPHA[n % 31] + s; n = Math.floor(n/31); }
  return s;
}
function srKeyFor(devCode, plan, dayCode){
  const clean=String(devCode||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  const p=String(plan||'L').toUpperCase();
  const d=String(dayCode||'AAA').toUpperCase();
  const h=srHashWide(SR_SECRET+'#'+clean+'#'+p+'#'+d+'#'+SR_SECRET,5);
  let out='';
  for(let i=0;i<12;i++) out += SR_ALPHA[parseInt(h.substr(i*2,2),16) % SR_ALPHA.length];
  return out;
}
function srBuildKey(devCode, plan, expiryTs){
  const p=String(plan||'L').toUpperCase();
  const dayCode = p==='L' ? 'AAA' : srEncDays(Math.round((expiryTs-SR_REF_EPOCH)/SR_DAY_MS));
  const sig = srKeyFor(devCode, p, dayCode);
  return (p+dayCode+sig).replace(/(.{4})/g,'$1-').replace(/-$/,'');
}

   منقول حرفياً من كود التطبيق (نفس السر ونفس دوال التجزئة) حتى يكون
   المفتاح المولّد هنا مقبولاً في التطبيق فوراً بلا أي تعديل عليه.
   رمز الجهاز: 12 حرفاً (بلا 0/1/O/I/L) — المفتاح: XXXX-XXXX-XXXX-XXXX دائم
   =================================================================== */
const UST_SECRET = 'USTADH-TEACHER-HN-2026';
const UST_ALPHA  = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function ustHash32(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
  }
  return h>>>0;
}
function ustHashWide(str, rounds){
  let out='', seed=str;
  for(let r=0;r<(rounds||5);r++){
    seed = str+'|'+r+'|'+ustHash32(seed+r);
    out += ('00000000'+ustHash32(seed).toString(16)).slice(-8);
  }
  return out.toUpperCase();
}
function ustNormKeyStr(str){
  return String(str==null?'':str)
    .replace(/[\u0660-\u0669]/g,function(d){return String(d.charCodeAt(0)-0x0660);})
    .replace(/[\u06F0-\u06F9]/g,function(d){return String(d.charCodeAt(0)-0x06F0);})
    .replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'')
    .toUpperCase().replace(/[^0-9A-Z]/g,'');
}
function ustKeyFor(devCode){

        '<button class="btn btn-whatsapp btn-sm" title="إرسال لرقم الزبون" onclick="sendCodeWA('+idx+')">📱</button>' +
        (!item.revoked?'<button class="btn btn-danger btn-sm" onclick="revokeFromHistory('+idx+')">🚫</button>':'') +
      '</div></div>';
  }).join('');
}

function generateCode(){
  const app=currentApp;
  const deviceCode=document.getElementById('deviceCode').value.trim();
  if(!deviceCode){showToast('⚠️ أدخل رمز الجهاز');return}
  const client=document.getElementById('clientName').value.trim();
  const durationEl=document.getElementById('duration');
  const duration=durationEl?parseInt(durationEl.value):9999;

  /* ===== الجدول الأسبوعي للمدارس المهنية: مفتاح VTS مستقل ودائم ===== */
  if(app.keyType==='vts'){
    const clean=vtsNormalizeDeviceCode(deviceCode);
    if(clean.length!==12){showToast('⚠️ رمز جهاز VTS يجب أن يكون 12 حرفاً — الآن '+clean.length);return}
    if(!vtsDeviceIsValid(clean)){showToast('⚠️ رمز جهاز VTS غير صالح — استخدم الرمز كما ظهر في التطبيق');return}
    const code=vtsActivationKeyFor(clean);
    document.getElementById('generatedCode').textContent=code;
    document.getElementById('waBtnGroup').style.display='flex';
    const h=getHistory(app);
    h.push({code,device:vtsFormatDeviceCode(clean),client,duration:9999,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
    saveHistory(app,h);
    renderHistoryList();
    showToast('✅ مفتاح VTS للجدول الأسبوعي للمدارس المهنية جاهز');
    return;
  }

  /* ===== الجدول المدرسي: نفس خوارزمية التطبيق — مفتاح دائم مربوط بالجهاز ===== */
  if(app.keyType==='schedule'){
    const clean=obNormKeyStr(deviceCode);
    if(clean.length!==12){showToast('⚠️ رمز الجهاز يجب أن يكون 12 حرفاً — الآن '+clean.length);return}
    let bad='';
    for(let i=0;i<clean.length;i++){if(OB_ALPHA.indexOf(clean.charAt(i))<0&&bad.indexOf(clean.charAt(i))<0)bad+=clean.charAt(i)}
    if(bad){showToast('⚠️ حروف غير صالحة في الرمز: '+bad+' — رمز الجهاز لا يحتوي 0 أو 1 أو O أو I أو L');return}
    const code=obKeyFor(clean);
    document.getElementById('generatedCode').textContent=code;
    document.getElementById('waBtnGroup').style.display='flex';
    const h=getHistory(app);
    h.push({code,device:clean.replace(/(.{4})/g,'$1-').replace(/-$/,''),client,duration:9999,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
    saveHistory(app,h);
    renderHistoryList();
    showToast('✅ مفتاح «الجدول المدرسي» جاهز');
    return;
  }

  /* ===== نظام المخاطبات الرسمية: نفس خوارزمية التطبيق — MKH-XXXX-XXXX دائم ===== */
  if(app.keyType==='mkh'){
    const clean=mkhNormDev(deviceCode);
    if(clean.length!==6){showToast('⚠️ رمز الجهاز يجب أن يكون 6 أحرف — الآن '+clean.length);return}
    let bad='';
    for(let i=0;i<clean.length;i++){if(MKH_ALPHA.indexOf(clean.charAt(i))<0&&bad.indexOf(clean.charAt(i))<0)bad+=clean.charAt(i)}
    if(bad){showToast('⚠️ حروف غير صالحة في الرمز: '+bad+' — رمز الجهاز لا يحتوي 0 أو 1 أو I أو O');return}
    const code=mkhKeyFor(clean);
    document.getElementById('generatedCode').textContent=code;
    document.getElementById('waBtnGroup').style.display='flex';
    const h=getHistory(app);
    h.push({code,device:mkhFmtDev(clean),client,duration:9999,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
    saveHistory(app,h);
    renderHistoryList();
    showToast('✅ مفتاح «نظام المخاطبات الرسمية» جاهز');
    return;
  }

  /* ===== تطبيق «الاستاذ»: نفس خوارزمية التطبيق — مفتاح دائم مربوط بالجهاز ===== */
  if(app.keyType==='ustadh'){
    const clean=ustNormKeyStr(deviceCode);
    if(clean.length!==12){showToast('⚠️ رمز الجهاز يجب أن يكون 12 حرفاً — الآن '+clean.length);return}
    let bad='';
    for(let i=0;i<clean.length;i++){if(UST_ALPHA.indexOf(clean.charAt(i))<0&&bad.indexOf(clean.charAt(i))<0)bad+=clean.charAt(i)}
    if(bad){showToast('⚠️ حروف غير صالحة في الرمز: '+bad+' — رمز الجهاز لا يحتوي 0 أو 1 أو O أو I أو L');return}
    const code=ustKeyFor(clean);
    document.getElementById('generatedCode').textContent=code;
    document.getElementById('waBtnGroup').style.display='flex';
    const h=getHistory(app);
    h.push({code,device:clean.replace(/(.{4})/g,'$1-').replace(/-$/,''),client,duration:9999,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
    saveHistory(app,h);
    renderHistoryList();
    showToast('✅ مفتاح «الاستاذ» جاهز');
    return;
  }

  /* ===== نظام نتائج المدرسة: نفس خوارزمية التطبيق — مفتاح بخطة شهري/سنوي/دائم ===== */
  if(app.keyType==='results'){
    const clean=srNormKeyStr(deviceCode);
    if(clean.length!==12){showToast('⚠️ رمز الجهاز يجب أن يكون 12 حرفاً — الآن '+clean.length);return}
    let bad='';
    for(let i=0;i<clean.length;i++){if(SR_ALPHA.indexOf(clean.charAt(i))<0&&bad.indexOf(clean.charAt(i))<0)bad+=clean.charAt(i)}
    if(bad){showToast('⚠️ حروف غير صالحة في الرمز: '+bad+' — رمز الجهاز لا يحتوي 0 أو 1 أو O أو I أو L');return}
    const planEl=document.getElementById('resultsPlan');
    const durVal=planEl?parseInt(planEl.value):9999;
    const plan = durVal===30?'M':(durVal===365?'Y':'L');
    const expiry = plan==='L'?null:(Date.now()+durVal*SR_DAY_MS);
    const code=srBuildKey(clean,plan,expiry);
    document.getElementById('generatedCode').textContent=code;
    document.getElementById('waBtnGroup').style.display='flex';
    const h=getHistory(app);
    h.push({code,device:clean.replace(/(.{4})/g,'$1-').replace(/-$/,''),client,duration:durVal,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
    saveHistory(app,h);
    renderHistoryList();
    showToast('✅ مفتاح «نظام نتائج المدرسة» جاهز');
    return;
  }

  const payload=JSON.stringify({d:deviceCode,exp:duration===9999?9999:Date.now()+(duration*86400000),dur:duration,ts:Date.now()});
  const code=hsmEncrypt(payload,app.secret);
  document.getElementById('generatedCode').textContent=code;
  document.getElementById('waBtnGroup').style.display='flex';
  const h=getHistory(app);
  h.push({code,device:deviceCode,client,duration,date:new Date().toISOString(),revoked:false,phone:obNormPhone((document.getElementById('clientPhone')||{}).value)});
  saveHistory(app,h);
  renderHistoryList();
  showToast('✅ تم توليد رمز التفعيل');
}

/* ✦ فتح واتساب مع «قائمة اختيار جهة الاتصال» — بلا رقم مسبق:
   على الجوال: بروتوكول whatsapp:// يفتح التطبيق مباشرة وتختار أي محادثة
   على الحاسوب: رابط api.whatsapp.com/send (واتساب ويب/سطح المكتب)
   وإن تعذّر كلاهما: ننسخ الرسالة لتلصقها في أي محادثة */
function obWaPick(msg){
  var enc=encodeURIComponent(msg);
  var ua=String(navigator.userAgent||'');
  var isMobile=/Android|iPhone|iPad|iPod/i.test(ua);
  var opened=false;
  var fallback=setTimeout(function(){
    if(opened||document.hidden)return;
    try{window.open('https://api.whatsapp.com/send/?text='+enc,'_blank');opened=true;return}catch(e){}
    try{navigator.clipboard.writeText(msg);}catch(e2){}
    showToast('📋 نُسخت الرسالة — الصقها في واتساب لأي جهة اتصال');
  },1400);
  try{
    if(isMobile){
      var onVis=function(){if(document.hidden){opened=true;clearTimeout(fallback);}};
      document.addEventListener('visibilitychange',onVis);
      window.location.href='whatsapp://send?text='+enc;
    }else{
      clearTimeout(fallback);
      var w=window.open('https://api.whatsapp.com/send/?text='+enc,'_blank');
      if(!w){try{navigator.clipboard.writeText(msg);}catch(e3){}
        showToast('📋 نُسخت الرسالة — الصقها في واتساب لأي جهة اتصال');}
    }
  }catch(e){
    clearTimeout(fallback);
    try{window.open('https://api.whatsapp.com/send/?text='+enc,'_blank');}catch(e4){}
  }
}

function revokeCode(){
  const app=currentApp;
  const code=document.getElementById('revokeCode').value.trim();
  const result=document.getElementById('revokeResult');
  if(!code){result.className='revoke-result error';result.textContent='⚠️ أدخل رمز التفعيل';return}
  const h=getHistory(app);
  let found=false;
  h.forEach(item=>{if(item.code===code){item.revoked=true;found=true}});
  if(found){saveHistory(app,h);result.className='revoke-result success';result.textContent='✅ تم إلغاء التفعيل بنجاح';renderHistoryList();showToast('✅ تم الإلغاء')}
  else{result.className='revoke-result error';result.textContent='⚠️ الرمز غير موجود في السجل'}
}

function revokeFromHistory(idx){
  const app=currentApp;
  if(!confirm('إلغاء تفعيل هذا الرمز؟'))return;
  const h=getHistory(app);
  if(h[idx]){h[idx].revoked=true;saveHistory(app,h);renderHistoryList();showToast('✅ تم الإلغاء')}
}

function clearHistory(){
  const app=currentApp;
  if(!confirm('مسح جميع السجلات؟'))return;
  saveHistory(app,[]);
  renderHistoryList();
  renderAppPanel();
  showToast('✅ تم مسح السجل');
}

const SCHOOL_LINKS_KEY='hsm_school_links_v1';
const SCHOOL_APP_BASE='https://hussainnahi1989-ctrl.github.io/-/';
function getSchoolLinks(){try{return JSON.parse(localStorage.getItem(SCHOOL_LINKS_KEY)||'[]')}catch(e){return[]}}
function saveSchoolLinks(a){localStorage.setItem(SCHOOL_LINKS_KEY,JSON.stringify(a))}
function slugSchool(v){
  v=String(v||'').trim().toLowerCase();
  v=v.replace(/\s+/g,'').replace(/[^a-z0-9_\-]/g,'');
  return v.slice(0,40);
}
function makeSchoolLink(){
  const name=(document.getElementById('schName')||{}).value||'';
  let code=slugSchool((document.getElementById('schCode')||{}).value||'');
  if(!code) code=slugSchool(name);
  if(!code){showToast('⚠️ اكتب رمزاً إنجليزياً مثل alnour');return}
  let base=((document.getElementById('schBase')||{}).value||SCHOOL_APP_BASE).trim();
  if(!base) base=SCHOOL_APP_BASE;
  base=base.replace(/\/?$/,'');
  if(base.indexOf('?')>=0) base=base.split('?')[0].replace(/\/$/,'');
  const url=base+'/?s='+encodeURIComponent(code);
  const box=document.getElementById('schoolLinkBox');
  if(box) box.textContent=url;
  const g=document.getElementById('schWaGroup'); if(g) g.style.display='flex';
  const a=getSchoolLinks();
  a.push({name:name.trim()||code,code:code,url:url,date:new Date().toISOString(),phone:obNormPhone((document.getElementById('schPhone')||{}).value)});
  saveSchoolLinks(a);
  renderSchoolLinkHist();
  showToast('✅ تم إنشاء رابط المدرسة');
}
function copySchoolLink(){
  const t=(document.getElementById('schoolLinkBox')||{}).textContent||'';
  if(!t||t.indexOf('http')!==0){showToast('⚠️ أنشئ الرابط أولاً');return}
